<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YummyFoodTgr</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #faf6f0; color: #1f2937; display: flex; min-height: 100vh; margin: 0; align-items: center; justify-content: center; text-align: center; }
  .card { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.08); padding: 32px 28px; max-width: 420px; margin: 16px; }
  h1 { color: #0e7490; margin: 0 0 8px; font-size: 28px; }
  p { margin: 8px 0; line-height: 1.5; }
  .spin { width: 28px; height: 28px; border: 3px solid #bfe3ea; border-top-color: #0e7490; border-radius: 50%; margin: 16px auto; animation: s 1s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  a { color: #0e7490; word-break: break-all; }
  .links { font-size: 13px; color: #6b7280; margin-top: 16px; }
  #status { font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <h1>YummyFoodTgr</h1>
  <div class="spin" id="spin"></div>
  <p id="status">Selamat datang di YummyFoodTgr! 🍜</p>
  <p class="links">Atau buka langsung lewat tautan ini:<br>
    <a id="linkA" href="https://e5f753d86897cc.lhr.life">Link utama</a><br>
    <a id="linkB" href="https://8f433d1760349f05-87-81-230-108.serveousercontent.com">Link alternatif</a>
  </p>
  <noscript><p><b>Aktifkan JavaScript</b> agar halaman ini bisa meneruskan kamu otomatis ke server yang sedang aktif.</p></noscript>
</div>
<script>
(function () {
  var URLS = ["https://e5f753d86897cc.lhr.life", "https://8f433d1760349f05-87-81-230-108.serveousercontent.com"];
  var TIMEOUT_MS = 8000;
  var RETRY_MS = 5000;
  // Teks status sengaja tidak pernah diubah: hanya salam pembuka.

  function probe(url) {
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, TIMEOUT_MS);
    return fetch(url + "/login", { mode: "no-cors", signal: ctrl.signal, cache: "no-store" })
      .then(function () { clearTimeout(timer); return url; })
      .catch(function () { clearTimeout(timer); throw new Error("down"); });
  }

  // Ambil daftar alamat terbaru dari urls.json (diperbarui tiap 15 detik
  // oleh updater) supaya halaman yang ter-cache lama pun tetap tahu alamat
  // tunnel yang sedang hidup — tanpa menunggu muat ulang 60 detik.
  function freshUrls() {
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 3000);
    return fetch("urls.json?_=" + Date.now(), { signal: ctrl.signal, cache: "no-store" })
      .then(function (r) { clearTimeout(timer); return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j) return null;
        var out = [];
        [j.main, j.alt].forEach(function (u) {
          if (typeof u === "string" && u.indexOf("http") === 0 && out.indexOf(u) < 0) out.push(u);
        });
        return out.length ? out : null;
      })
      .catch(function () { clearTimeout(timer); return null; });
  }

  function ordered(list) {
    var lastGood = null;
    try { lastGood = localStorage.getItem("yummyfoodtgr_last_good"); } catch (e) {}
    if (lastGood && list.indexOf(lastGood) > 0) {
      list.splice(list.indexOf(lastGood), 1);
      list.unshift(lastGood);
    }
    return list;
  }

  function go() {
    freshUrls().then(function (fresh) {
      var list = URLS.slice();
      if (fresh) fresh.forEach(function (u) { if (list.indexOf(u) < 0) list.push(u); });
      return Promise.any(ordered(list).map(probe));
    }).then(function (url) {
      try { localStorage.setItem("yummyfoodtgr_last_good", url); } catch (e) {}
      location.replace(url + "/");
    }).catch(function () {
      setTimeout(go, RETRY_MS);
    });
  }

  // Muat ulang halaman tiap 60 detik saat belum berhasil, supaya alamat
  // terbaru dari server selalu terpakai.
  var reloadTimer = setTimeout(function () { location.reload(); }, 60000);
  var _replace = location.replace.bind(location);
  location.replace = function (u) { clearTimeout(reloadTimer); _replace(u); };

  go();
})();
</script>
</body>
</html>
